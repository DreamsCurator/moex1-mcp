[project]
name = "moex1-mcp"
version = "0.1.0"
description = "MCP server for MOEX ISS+ (ALGOPACK) and a Telegram bot that routes queries via OpenAI tool calling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "websockets>=12.0",
    "aiogram>=3.13.0",
    "openai>=1.50.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: live tests that require real credentials in .env",
]

[tool.setuptools.packages.find]
include = ["mcp_server*", "telegram_bot*"]
